<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyNote - Direct</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>body{background:#0B1224;font-family:Inter,sans-serif;color:white}.card{background:#151E35;border:1px solid #233154}</style>
</head>
<body class="bg-[#0B1224] min-h-screen p-4 flex items-center justify-center">

<div id="login" class="w-full max-w-[520px]">
  <div class="text-center mb-6">
    <div class="w-12 h-12 rounded-xl bg-[#6C7CFF] flex items-center justify-center font-bold text-xl mx-auto mb-3">M</div>
    <h1 class="text-[24px] font-[800]">MyNote - Connexion directe</h1>
    <p class="text-white/60 text-[12px] mt-1">Si les boutons ne marchent pas, recharge la page (Ctrl+F5)</p>
  </div>

  <div class="card rounded-[20px] p-6">
    <label class="text-[11px] font-bold text-white/50 uppercase">URL Pronote</label>
    <input id="url" value="https://0352686e.index-education.net/pronote/" class="w-full h-[44px] px-3 rounded-xl bg-[#0B1224] border border-[#233154] text-[13px] mt-1 mb-3">

    <button id="btnTest" type="button" onclick="testUrl()" class="w-full h-[44px] rounded-xl bg-white/10 hover:bg-white/20 text-[13px] font-semibold mb-2">🔍 Tester URL (depuis ton IP)</button>
    <button id="btnEnt" type="button" onclick="connectEnt()" class="w-full h-[48px] rounded-xl bg-[#6C7CFF] hover:bg-[#8B9AFF] text-white font-bold text-[14px]">🔐 Connexion ENT (comme Papillon)</button>

    <div id="status" class="hidden mt-3 text-[12px] p-3 rounded-xl bg-white/5 border border-[#233154]"></div>

    <div class="mt-4 p-3 rounded-xl bg-[#2ECC71]/10 border border-[#2ECC71]/20 text-[11px]">
      <b>✅ Fix boutons:</b> Si tu ne peux pas cliquer, fais <b>Ctrl+F5</b> pour recharger sans cache. Le site utilise du JS qui peut être bloqué par une ancienne version en cache.
    </div>

    <div class="mt-4">
      <div class="text-[11px] font-bold uppercase text-white/40 mb-2">QR Code</div>
      <textarea id="qr" placeholder="Colle QR JSON" class="w-full h-[50px] p-2 rounded-xl bg-[#0B1224] border border-[#233154] text-[11px] font-mono"></textarea>
      <input id="pin" placeholder="PIN" class="w-full mt-2 h-[36px] px-3 rounded-xl bg-[#0B1224] border border-[#233154] text-[12px]">
      <button type="button" onclick="connectQr()" class="w-full mt-2 h-[36px] rounded-xl bg-white/10 text-[12px]">Connexion QR</button>
      <div id="qrStatus" class="hidden mt-2 text-[11px] p-2 rounded-xl"></div>
    </div>
  </div>
</div>

<div id="app" class="hidden w-full max-w-[900px]">
  <div class="flex justify-between items-center mb-6">
    <div class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl bg-[#6C7CFF] flex items-center justify-center font-bold">M</div><span class="font-bold">MyNote</span></div>
    <button onclick="localStorage.clear();location.reload()" class="px-4 py-2 rounded-xl bg-white/10 text-[12px]">Déco</button>
  </div>
  <div id="user" class="card rounded-[16px] p-4 mb-4"></div>
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
    <div class="card rounded-[16px] p-4"><h3 class="font-bold mb-2">📅 EDT</h3><div id="edt" class="text-[12px] space-y-1"></div></div>
    <div class="card rounded-[16px] p-4"><h3 class="font-bold mb-2">📊 Notes</h3><div id="notes" class="text-[12px]"></div></div>
    <div class="card rounded-[16px] p-4"><h3 class="font-bold mb-2">📚 Devoirs</h3><div id="devoirs" class="text-[12px]"></div></div>
  </div>
</div>

<script>
// Simple non-module JS - buttons will work even if pawnote fails
function showStatus(msg, type){
  const el=document.getElementById('status');
  el.classList.remove('hidden');
  el.innerHTML=msg;
  el.className='mt-3 text-[12px] p-3 rounded-xl '+(type==='error'?'bg-red-500/20 text-red-300':type==='success'?'bg-[#2ECC71]/20 text-[#2ECC71]':'bg-white/5 border border-[#233154]');
}
function showQrStatus(msg,type){
  const el=document.getElementById('qrStatus');
  el.classList.remove('hidden');
  el.innerHTML=msg;
  el.className='mt-2 text-[11px] p-2 rounded-xl '+(type==='error'?'bg-red-500/20 text-red-300':'bg-[#2ECC71]/20 text-[#2ECC71]');
}

async function testUrl(){
  const url=document.getElementById('url').value.trim();
  showStatus('Test depuis ton navigateur...<br>URL: '+url);
  try{
    // Try to fetch instance via our server proxy first (to avoid CORS), then direct
    const res=await fetch('/api/test-pronote?url='+encodeURIComponent(url));
    const j=await res.json();
    if(j.success){
      showStatus('✅ '+j.instance.name+'<br>Version: '+(j.instance.version||'?')+'<br>CAS: '+(j.instance.hasCAS?'Oui':'Non')+'<br><br>✅ Serveur OK, maintenant test depuis ton IP (méthode directe)...<br><button onclick="testDirect()" class="mt-2 px-3 py-1 rounded bg-[#6C7CFF] text-white text-[11px]">Tester depuis mon IP (comme Papillon)</button>', 'success');
    } else {
      showStatus('❌ Serveur: '+j.error+'<br><br>Essaie quand même connexion ENT directe', 'error');
    }
  }catch(e){
    showStatus('❌ Erreur: '+e.message, 'error');
  }
}

async function testDirect(){
  const url=document.getElementById('url').value.trim();
  showStatus('Test direct depuis ton navigateur (IP FR) via pawnote CDN...');
  try{
    const pawnote=await import('https://cdn.jsdelivr.net/npm/pawnote@1.6.2/+esm');
    const clean=pawnote.cleanURL(url);
    showStatus('cleanURL: '+clean+'<br>Fetching instance depuis ton IP...');
    const instance=await pawnote.instance(clean);
    showStatus('✅ Direct OK depuis ton IP!<br>'+instance.name+'<br>CAS: '+(instance.casURL?'Oui':'Non')+'<br><br>Tu peux cliquer Connexion ENT', 'success');
  }catch(e){
    showStatus('❌ Direct: '+e.name+' '+e.message+'<br><br>Si PageUnavailableError, même ton IP est bloquée (essaie en 4G). Sinon, essaie QR Code.', 'error');
  }
}

async function connectEnt(){
  const url=document.getElementById('url').value.trim();
  showStatus('🔐 Méthode Papillon directe depuis ton navigateur...<br><br>Ouverture de Pronote dans un nouvel onglet. Connecte-toi via EduConnect là-bas, puis on extrait le token.', 'info');
  
  // Open ENT login page that does auto-extract without bookmark bar
  const entUrl='/ent/login?url='+encodeURIComponent(url);
  const win=window.open(entUrl, '_blank');
  if(!win){
    showStatus('❌ Popup bloqué! Autorise les popups pour ce site puis réessaie. Ou ouvre manuellement: <a href="'+entUrl+'" target="_blank" class="underline text-[#6C7CFF]">'+entUrl+'</a>', 'error');
    return;
  }
  
  showStatus('✅ Onglet ENT ouvert<br><br>1. Dans le nouvel onglet, clique "📋 Copier le code"<br>2. Va sur toutatice.fr → Pronote (EDT visible)<br>3. F12 → Console → Ctrl+V → Entrée<br>4. Bulle verte → reviens ici → clique "Charger"', 'success');
  
  window.addEventListener('message', (e)=>{
    if(e.data && e.data.type==='mynote:real-data' && e.data.data.success){
      showStatus('✅ Données reçues: '+e.data.data.user.name, 'success');
      localStorage.setItem('mynote_real', JSON.stringify(e.data.data));
      enterApp(e.data.data);
    }
  });
}

async function connectQr(){
  const qrData=document.getElementById('qr').value.trim();
  const pin=document.getElementById('pin').value.trim();
  if(!qrData){ showQrStatus('Colle QR', 'error'); return; }
  showQrStatus('Connexion QR depuis ton navigateur...', 'info');
  try{
    const pawnote=await import('https://cdn.jsdelivr.net/npm/pawnote@1.6.2/+esm');
    let qrObj=null;
    if(qrData.startsWith('pronote://')){
      const u=new URL(qrData);
      qrObj={url:u.searchParams.get('url'), login:u.searchParams.get('login'), jeton:u.searchParams.get('jeton')};
    } else {
      try{ qrObj=JSON.parse(qrData); }catch{
        const urlMatch=qrData.match(/https?:\/\/[^\s"']+\.index-education\.net\/pronote\/?/i);
        const loginMatch=qrData.match(/"login"\s*:\s*"([A-F0-9]+)"/i);
        const jetonMatch=qrData.match(/"jeton"\s*:\s*"([A-F0-9]+)"/i) || qrData.match(/([A-F0-9]{100,})/i);
        if(urlMatch) qrObj={url:urlMatch[0], login:loginMatch?.[1], jeton:jetonMatch?.[1]||jetonMatch?.[0]};
      }
    }
    if(!qrObj?.url) throw new Error('QR invalide');
    const session=pawnote.createSessionHandle();
    const deviceUUID='mynote-'+Math.random().toString(36).slice(2);
    await pawnote.loginQrCode(session, {qr:{url:qrObj.url, login:qrObj.login, jeton:qrObj.jeton}, pin, deviceUUID, navigatorIdentifier:'MyNote'});
    const [timetable, grades, homeworks]=await Promise.all([
      pawnote.timetableFromIntervals(session, new Date(), new Date(Date.now()+7*86400000)).catch(e=>({error:e.message,classes:[]})),
      pawnote.gradesOverview(session).catch(e=>({error:e.message})),
      pawnote.assignmentsFromIntervals(session, new Date(), new Date(Date.now()+14*86400000)).catch(e=>[])
    ]);
    const data={success:true,user:{name:session.user?.name, class:session.user?.studentClass?.name},instance:{url:qrObj.url},timetable,grades,homeworks,method:'qr-direct'};
    localStorage.setItem('mynote_real', JSON.stringify(data));
    showQrStatus('✅ '+data.user.name, 'success');
    enterApp(data);
  }catch(e){
    showQrStatus('❌ '+e.name+' '+e.message, 'error');
  }
}

function enterApp(data){
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('user').innerHTML=`<div class="font-bold text-[16px]">${data.user?.name||'Élève'}</div><div class="text-[12px] text-white/60">${data.user?.class||''} • ${data.instance?.url||''}</div>`;
  const tt=data.timetable?.classes||[];
  document.getElementById('edt').innerHTML=tt.length?tt.slice(0,8).map(c=>`<div class="p-2 rounded-lg bg-[#0B1224] border border-[#233154] mb-1"><b>${c.startDate?new Date(c.startDate).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):''}</b> ${c.subject?.name||''}</div>`).join(''):'Pas de cours';
  const gr=data.grades?.grades||[];
  document.getElementById('notes').innerHTML=gr.length?gr.slice(0,8).map(g=>`<div class="p-2 rounded-lg bg-[#0B1224] border border-[#233154] mb-1">${g.subject?.name||''}: ${g.grade?.value||''}</div>`).join(''):'Pas de notes';
  const hw=data.homeworks||[];
  document.getElementById('devoirs').innerHTML=hw.length?hw.map(h=>`<div class="p-2 rounded-lg bg-[#0B1224] border border-[#233154] mb-1">${h.subject?.name||''}: ${(h.description||'').substring(0,80)}</div>`).join(''):'Pas de devoirs';
}

const saved=localStorage.getItem('mynote_real');
if(saved){ try{ enterApp(JSON.parse(saved)); }catch{} }

window.addEventListener('message', (e)=>{
  if(e.data && e.data.type==='mynote:real-data' && e.data.data.success){
    localStorage.setItem('mynote_real', JSON.stringify(e.data.data));
    enterApp(e.data.data);
  }
});

// Test if JS works
console.log('MyNote JS loaded');
document.addEventListener('DOMContentLoaded', ()=>{
  console.log('DOM loaded, buttons should work');
  // Add visual feedback that buttons are clickable
  document.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click', ()=>{ b.style.transform='scale(0.95)'; setTimeout(()=>b.style.transform='', 100); });
  });
});
</script>
</body>
</html>
